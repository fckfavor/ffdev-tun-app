name: Bug report
description: Report a reproducible problem in FF.Dev Tun.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve FF.Dev Tun.
        **Never include VLESS links, UUIDs, certificate pins, server addresses or credentials.**
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.4.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7 — Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you did before the problem appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove private connection data before posting logs.
    validations:
      required: true